configs:
  startup.conf:
    content: |
      unix {cli-listen /run/vpp/cli-vpp.sock}
      api-segment { prefix vpp }
      plugins { plugin dpdk_plugin.so { enable } }
      cpu {
        main-core 0
        corelist-workers 3
      }
      dpdk {
        no-pci
        vdev net_vhost_user0,iface=/var/run/dpdk-app/vhost0,client=1
        vdev net_vhost_user1,iface=/var/run/dpdk-app/vhost1,client=1
      }
services:
  img-vpp:
    build: ../../../../../../Dockerfile/vpp
    image: jumpstart-vpp:latest
    pull_policy: never
  img-mimicached-iip-dpdk:
    build: ../../../../../../Dockerfile/mimicached-iip-dpdk
    image: jumpstart-mimicached-iip-dpdk:latest
    pull_policy: never
  vpp:
    image: jumpstart-vpp:latest
    pull_policy: never
    cap_add:
      - SYS_NICE
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - /dev/hugepages:/dev/hugepages
      - ./tmp-sock:/var/run/dpdk-app
    configs:
      - source: startup.conf
        target: /startup.conf
    command: sh -c "/usr/bin/vpp -c /startup.conf; sleep 2; /usr/bin/vppctl -s /var/run/vpp/cli-vpp.sock set interface state VhostEthernet0 up; /usr/bin/vppctl -s /var/run/vpp/cli-vpp.sock set interface state VhostEthernet1 up; sleep 2; /usr/bin/vppctl -s /var/run/vpp/cli-vpp.sock set interface l2 bridge VhostEthernet0 100; /usr/bin/vppctl -s /var/run/vpp/cli-vpp.sock set interface l2 bridge VhostEthernet1 100; tail -f /dev/null"
  mimicached:
    image: jumpstart-mimicached-iip-dpdk:latest
    pull_policy: never
    depends_on:
      - vpp
    cap_add:
      - SYS_NICE
      - IPC_LOCK
    volumes:
      - /dev/hugepages:/dev/hugepages
      - ./tmp-sock:/var/run/dpdk-app
    command: sh -c "unlink /var/run/dpdk-app/vhost0; LD_LIBRARY_PATH=/dpdk/install/lib/dpdk /mimicached/a.out -l 1 --proc-type=primary --file-prefix=pmd1 --vdev=net_virtio_user0,path=/var/run/dpdk-app/vhost0,server=1 --no-pci --single-file-segments -- -a 0,10.100.0.20 -e 0 -- -p 11211 -m 10000 -z 100000"
  client:
    image: jumpstart-mimicached-iip-dpdk:latest
    pull_policy: never
    depends_on:
      - vpp
    cap_add:
      - SYS_NICE
      - IPC_LOCK
    volumes:
      - /dev/hugepages:/dev/hugepages
      - ./tmp-sock:/var/run/dpdk-app
    command: sh -c "unlink /var/run/dpdk-app/vhost1; LD_LIBRARY_PATH=/dpdk/install/lib/dpdk /bench-iip/a.out -l 2 --proc-type=primary --file-prefix=pmd2 --vdev=net_virtio_user1,path=/var/run/dpdk-app/vhost1,server=1 --no-pci --single-file-segments -- -a 0,10.100.0.10 -e 0 -- -s 10.100.0.20 -p 11211 -m \"```echo -e 'get a\\r\\n\0'```\" -c 64"
    tty: true
