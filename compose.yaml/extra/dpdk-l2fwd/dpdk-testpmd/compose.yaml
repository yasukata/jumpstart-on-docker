services:
  img-dpdk:
    build: ../../../../Dockerfile/dpdk
    image: jumpstart-dpdk:latest
    pull_policy: never
  img-bench-iip-dpdk:
    build: ../../../../Dockerfile/bench-iip-dpdk
    image: jumpstart-bench-iip-dpdk:latest
    pull_policy: never
  dpdk-l2fwd:
    image: jumpstart-dpdk:latest
    pull_policy: never
    cap_add:
      - SYS_NICE
      - NET_ADMIN
    volumes:
      - /dev/hugepages:/dev/hugepages
      - ./tmp-sock:/var/run/dpdk-app
    command: sh -c "cd /dpdk/dpdk-25.11/build; meson configure -Dexamples=l2fwd > /dev/null; ninja > /dev/null; /dpdk/dpdk-25.11/build/examples/dpdk-l2fwd -l 0,3 --proc-type=primary --file-prefix=pmd0 --vdev=net_vhost0,iface=/var/run/dpdk-app/vhost0,client=1 --vdev=net_vhost1,iface=/var/run/dpdk-app/vhost1,client=1 --no-pci --single-file-segments -- -p 3 --no-mac-updating > /dev/null"
  receiver:
    image: jumpstart-bench-iip-dpdk:latest
    pull_policy: never
    depends_on:
      - dpdk-l2fwd
    cap_add:
      - SYS_NICE
      - IPC_LOCK
    volumes:
      - /dev/hugepages:/dev/hugepages
      - ./tmp-sock:/var/run/dpdk-app
    command: sh -c "unlink /var/run/dpdk-app/vhost0; /dpdk/install/bin/dpdk-testpmd -l 0,1 --proc-type=primary --file-prefix=pmd1 --vdev=net_virtio_user0,path=/var/run/dpdk-app/vhost0,server=1 --no-pci --single-file-segments -- --nb-cores=1 --forward-mode=rxonly --stats-period=1"
  sender:
    image: jumpstart-bench-iip-dpdk:latest
    pull_policy: never
    depends_on:
      - dpdk-l2fwd
    cap_add:
      - SYS_NICE
      - IPC_LOCK
    volumes:
      - /dev/hugepages:/dev/hugepages
      - ./tmp-sock:/var/run/dpdk-app
    command: sh -c "unlink /var/run/dpdk-app/vhost1; /dpdk/install/bin/dpdk-testpmd -l 0,2 --proc-type=primary --file-prefix=pmd2 --vdev=net_virtio_user1,path=/var/run/dpdk-app/vhost1,server=1 --no-pci --single-file-segments -- --nb-cores=1 --forward-mode=txonly --txpkt=60"
    tty: true
