services:
  img:
    build: ../../../Dockerfile/mimicached-iip-af_xdp
    image: jumpstart-mimicached-iip-af_xdp:latest
    pull_policy: never
  mimicached:
    image: jumpstart-mimicached-iip-af_xdp:latest
    pull_policy: never
    cap_add:
      - SYS_NICE
      - SYS_ADMIN
      - NET_ADMIN
      - IPC_LOCK
      - BPF
    command: sh -c "/mimicached/a.out -l 0 -i eth0 -- -p 11211 -m 1024 -z 100000"
  client:
    image: jumpstart-mimicached-iip-af_xdp:latest
    pull_policy: never
    cap_add:
      - SYS_NICE
      - SYS_ADMIN
      - NET_ADMIN
      - IPC_LOCK
      - BPF
    command: sh -c "/bench-iip/a.out -l 1 -i eth0 -- -s `getent hosts mimicached | awk '{ print $1 }'` -p 11211 -m \"```echo -e 'get a\\r\\n\0'```\" -c 64"
