services:
  img:
    build: ../../../Dockerfile/bench-iip-af_xdp
    image: jumpstart-bench-iip-af_xdp:latest
    pull_policy: never
  server:
    image: jumpstart-bench-iip-af_xdp:latest
    pull_policy: never
    cap_add:
      - SYS_NICE
      - SYS_ADMIN
      - NET_ADMIN
      - IPC_LOCK
      - BPF
    command: sh -c "/bench-iip/a.out -l 0 -i eth0 -- -p 10000 -l 1"
  client:
    image: jumpstart-bench-iip-af_xdp:latest
    pull_policy: never
    cap_add:
      - SYS_NICE
      - SYS_ADMIN
      - NET_ADMIN
      - IPC_LOCK
      - BPF
    command: sh -c "/bench-iip/a.out -l 1 -i eth0 -- -s `getent hosts server | awk '{ print $1 }'` -p 10000 -l 1 -c 64"
